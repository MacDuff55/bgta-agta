<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B.GTA Calendar</title>
<meta name="description" content="Time, re-dated around GTA VI: B.GTA counts down to November 19, 2026, A.GTA counts up after it.">
<meta name="theme-color" content="#0a0714">
<link rel="canonical" href="https://macduff55.github.io/bgta-agta/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B.GTA">

<meta property="og:type" content="website">
<meta property="og:title" content="B.GTA Calendar">
<meta property="og:description" content="Days before GTA VI are B.GTA, days after are A.GTA. What day is it today?">
<meta property="og:url" content="https://macduff55.github.io/bgta-agta/">
<meta property="og:image" content="https://macduff55.github.io/bgta-agta/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<script>
  (function(){
    var pref = 'auto';
    try { pref = localStorage.getItem('bgta-theme') || 'auto'; } catch (e) {}
    var theme = pref === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'night') : pref;
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
  <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M12 10V2M4.9 10.9l1.4 1.4M2 18h2M20 18h2M19.1 10.9l-1.4 1.4M22 22H2M16 6l-4 4-4-4M16 18a4 4 0 0 0-8 0"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3-3a2 2 0 0 0-2.8 0L6 21"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8M3 3v5h5M12 7v5l4 2"/></symbol>
  <symbol id="ev-announce" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></symbol>
  <symbol id="ev-trailer" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/></symbol>
  <symbol id="ev-delay" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="ev-release" viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6C2.6 9.4 2 14.5 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.4-1.4A2 2 0 0 1 9.8 16h4.4a2 2 0 0 1 1.4.6L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.5-.6-6.6-.7-7.3A4 4 0 0 0 17.3 5z"/></symbol>
  <symbol id="ev-update" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></symbol>
</svg>

<main class="app">

  <div class="col col-left">
    <section class="hero panel" aria-labelledby="heroSub">
      <div class="sun" aria-hidden="true"></div>
      <div class="grid-floor" aria-hidden="true"></div>
      <div class="topbar">
        <span class="chip"><span class="live" aria-hidden="true"></span><span id="todayChip">—</span></span>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" type="button"><svg class="icon"><use href="#i-auto"/></svg></button>
          <button class="icon-btn" id="langBtn" type="button"><svg class="icon"><use href="#i-globe"/></svg></button>
        </div>
      </div>
      <p class="wordmark" id="heroWordmark">B.GTA</p>
      <p class="hero-number" id="heroNumber">--</p>
      <p class="hero-sub" id="heroSub" aria-live="polite">…</p>
      <div class="clock" id="clock" hidden>
        <div><b id="clkH">00</b><span id="lblH"></span></div>
        <div><b id="clkM">00</b><span id="lblM"></span></div>
        <div><b id="clkS">00</b><span id="lblS"></span></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="statWeeks">–</b><span id="lblWeeks"></span></div>
        <div class="stat"><b id="statMonths">–</b><span id="lblMonths"></span></div>
        <div class="stat"><b id="statNext">–</b><span id="lblNext"></span></div>
      </div>
      <div class="hero-actions">
        <button class="btn-primary" id="heroShareBtn" type="button"><svg class="icon"><use href="#i-share"/></svg><span></span></button>
        <button id="installBtn" type="button" hidden><svg class="icon"><use href="#i-phone"/></svg><span></span></button>
      </div>
      <p class="hero-date" id="heroDateLine"></p>
      <p class="hero-note" id="heroNote"></p>
    </section>
  </div>

  <div class="col">
    <section class="panel panel-pad" aria-labelledby="monthLabel">
      <div class="cal-head">
        <h2 class="month-label" id="monthLabel">—</h2>
        <div class="nav">
          <button class="icon-btn" id="prevBtn" type="button"><svg class="icon"><use href="#i-left"/></svg></button>
          <button class="icon-btn" id="nextBtn" type="button"><svg class="icon"><use href="#i-right"/></svg></button>
        </div>
      </div>
      <div class="cal-tools">
        <div class="segmented" role="group">
          <button type="button" id="viewMonth" aria-pressed="true"><svg class="icon"><use href="#i-calendar"/></svg><span></span></button>
          <button type="button" id="viewYear" aria-pressed="false"><svg class="icon"><use href="#i-grid"/></svg><span></span></button>
        </div>
        <div class="quick">
          <button class="btn-cyan" id="todayBtn" type="button"></button>
          <button class="btn-gold" id="releaseBtn" type="button"></button>
        </div>
      </div>

      <div id="monthView">
        <div class="weekdays" id="weekdaysRow" aria-hidden="true"></div>
        <div class="calendar" id="calendar" role="grid"></div>
      </div>
      <div class="year" id="yearView" hidden></div>

      <div class="detail" id="detail" aria-live="polite"></div>

      <div class="legend">
        <div class="legend-row"><span class="dot cyan"></span><span id="legendBefore"></span></div>
        <div class="legend-row"><span class="dot pink"></span><span id="legendAfter"></span></div>
        <div class="legend-row"><span class="dot gold"></span><span id="legendMilestone"></span></div>
        <div class="legend-row"><svg class="icon"><use href="#ev-trailer"/></svg><span id="legendEvent"></span></div>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="panel panel-pad" aria-labelledby="convTitle">
      <h2 class="panel-title" id="convTitle"><svg class="icon"><use href="#i-swap"/></svg><span></span></h2>
      <p class="panel-sub" id="convSub"></p>
      <div class="conv-grid">
        <div class="field">
          <label for="convDate" id="convDateLabel"></label>
          <input type="date" id="convDate">
        </div>
        <button class="conv-swap" type="button" tabindex="-1" aria-hidden="true"><svg class="icon"><use href="#i-swap"/></svg></button>
        <div class="field">
          <label for="convCode" id="convCodeLabel"></label>
          <input type="text" id="convCode" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="convError">
        </div>
      </div>
      <p class="conv-error" id="convError" role="alert"></p>
      <div class="result" id="convResult" aria-live="polite">
        <div class="big" id="convBig">—</div>
        <p id="convLine"></p>
      </div>
      <div class="chips" id="convChips"></div>
      <div class="row-actions">
        <button id="convCardBtn" type="button"><svg class="icon"><use href="#i-image"/></svg><span></span></button>
        <button id="convLinkBtn" type="button"><svg class="icon"><use href="#i-link"/></svg><span></span></button>
      </div>
    </section>

    <section class="panel panel-pad" id="sharePanel" aria-labelledby="shareTitle">
      <h2 class="panel-title" id="shareTitle"><svg class="icon"><use href="#i-share"/></svg><span></span></h2>
      <div class="share-wrap">
        <canvas class="share-canvas" id="shareCanvas" width="1080" height="1080" role="img"></canvas>
        <div class="share-side">
          <p id="shareSub"></p>
          <div class="row-actions">
            <button class="btn-primary" id="shareBtn" type="button"><svg class="icon"><use href="#i-share"/></svg><span></span></button>
            <button id="downloadBtn" type="button"><svg class="icon"><use href="#i-download"/></svg><span></span></button>
            <button id="copyBtn" type="button"><svg class="icon"><use href="#i-link"/></svg><span></span></button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel panel-pad" aria-labelledby="timelineTitle">
      <h2 class="panel-title" id="timelineTitle"><svg class="icon"><use href="#i-history"/></svg><span></span></h2>
      <p class="panel-sub" id="timelineSub"></p>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <footer>
      <span id="footerText"></span>
      <a href="https://github.com/MacDuff55/bgta-agta" id="sourceLink" rel="noopener"></a>
    </footer>
  </div>

</main>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
